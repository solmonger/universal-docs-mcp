name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked verification dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Static checks
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
      - name: Build and install the wheel (not editable source)
        run: |
          python -m build --no-isolation
          python -m pip install --no-deps dist/*.whl
          python -m pip check
      - name: Verify installed package from outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" -q
          python "$GITHUB_WORKSPACE/scripts/smoke.py" --output "$RUNNER_TEMP/stdio-smoke.json"
