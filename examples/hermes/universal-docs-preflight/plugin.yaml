manifest_version: 2
name: universal-docs-preflight
version: "0.2.0"
description: Inject shared validated documentation context once per Hermes turn.
author: Hermes Agent
tags: [documentation, hooks, preflight]
kind: standalone
provides_hooks: [pre_llm_call]
hooks: [pre_llm_call]
config_schema:
  executable:
    type: string
    required: true
    description: Absolute regular-file path to the reviewed universal-docs-context CLI.
  request_file:
    type: string
    required: true
    description: Absolute trusted JSON request file; never chosen from a hook payload.
  timeout_ms:
    type: integer
    default: 3000
    description: Outer process deadline (100–10000 ms); keep below host hook timeout.
